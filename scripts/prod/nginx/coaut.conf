# Co-Aut prod — conf finale (installée en /etc/nginx/conf.d/coaut.conf par scripts/prod/bascule.sh).
# app.co-aut.com → app Next (coaut-app, 127.0.0.1:3100) ; auth, app-api, auth-api (ancienne appli
# .NET / Angular) → redirection permanente vers app.co-aut.com. IPv4 et IPv6.

server {
    listen 80;
    listen [::]:80;
    server_name app.co-aut.com auth.co-aut.com app-api.co-aut.com auth-api.co-aut.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://app.co-aut.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.co-aut.com app-api.co-aut.com auth-api.co-aut.com;
    include /etc/nginx/coaut/ssl.inc;
    location / { return 301 https://app.co-aut.com/; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.co-aut.com;
    include /etc/nginx/coaut/ssl.inc;

    client_max_body_size 5M;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}
