<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#F3F1EE;font-family:Inter,Arial,Helvetica,sans-serif;color:#1C1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F1EE;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E8E6E3;">
            <tr>
              <td align="center" style="background:#1C1917;padding:22px;">
                <img src="{{ .SiteURL }}/images/logo-co-aut.png" alt="Co-Aut" width="150" style="display:block;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px;font-size:16px;line-height:1.5;">
                <p style="margin:0 0 16px;font-family:'Zilla Slab',Georgia,serif;font-size:26px;line-height:1.15;font-weight:bold;color:#1C1917;">Bienvenue sur Co-Aut</p>
                <p style="margin:0 0 24px;">Plus qu&rsquo;une étape : confirme ton adresse email pour entrer sur Co-Aut et commencer à écrire.</p>
                <p style="margin:0 0 24px;" align="center">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#FF8A1E;color:#1C1917;text-decoration:none;font-weight:bold;padding:14px 28px;border-radius:10px;">Confirmer mon adresse</a>
                </p>
                <p style="margin:0;font-size:14px;color:#57524D;">Si tu n'as pas créé de compte sur Co-Aut, ignore ce message.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
