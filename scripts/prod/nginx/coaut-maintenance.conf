# Co-Aut prod — PAGE DE MAINTENANCE pendant la bascule (installée en /etc/nginx/conf.d/coaut.conf
# par scripts/prod/bascule.sh, à la place de l'ancienne conf conf.d/sites.conf mise de côté).
# IPv4 et IPv6 : les 4 noms ont un AAAA vers le VPS.

server {
    listen 80;
    listen [::]:80;
    server_name app.co-aut.com auth.co-aut.com app-api.co-aut.com auth-api.co-aut.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.co-aut.com auth.co-aut.com app-api.co-aut.com auth-api.co-aut.com;
    include /etc/nginx/coaut/ssl.inc;
    root /var/www/coaut-maintenance;
    location / {
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503;
    }
    error_page 503 /index.html;
    location = /index.html { internal; }
}
